# Local voice services (Home Assistant's own "Wyoming" stack), Empathika herself, optional local LLM.
#   docker compose up -d                       voice services only (run Empathika with npm on the host)
#   docker compose --profile empathika up -d --build voice services + Empathika in a container
#   docker compose run --rm empathika node dist/tools/chat.js     type to Empathika (no audio needed)
#   add --profile local-llm for Ollama
# Running Empathika in Docker on a Mac/Windows laptop needs a sound bridge: see docs/DOCKER.md.
# Keep container logs small: on a Raspberry Pi running from an SD card, endless log writes are
# what wears the card out. 3 files x 5 MB per service is plenty for troubleshooting.
x-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"

services:
  empathika:
    logging: *logging
    build: .
    profiles: ["empathika"]
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside Docker the voice services are reached by name, not 127.0.0.1.
      WAKEWORD_HOST: openwakeword
      STT_HOST: whisper
      TTS_HOST: piper
      # Sound bridge (docs/DOCKER.md). Default suits Mac + Windows Docker Desktop.
      PULSE_SERVER: ${PULSE_SERVER:-tcp:host.docker.internal:4713}
      CONTROL_PANEL_HOST: 0.0.0.0
      FACE_HOST: 0.0.0.0
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [openwakeword, whisper, piper]
    # Control panel (resident memory, staff PINs, family news): http://localhost:8099, this computer only
    # Face screen preview: http://localhost:8098 (add ?demo to see every expression)
    ports: ["127.0.0.1:8099:8099", "127.0.0.1:8098:8098"]
    # empathika-data holds Empathika's memory of the resident (encrypted); kept across restarts/rebuilds.
    volumes: ["./config:/app/config:ro", "empathika-data:/app/data"]

  openwakeword:
    logging: *logging
    image: rhasspy/wyoming-openwakeword:latest
    restart: unless-stopped
    # Custom models (e.g. hey_empathika.tflite) go in ./wakewords - see training/README.md.
    # Tuning (in .env): WAKEWORD_THRESHOLD (0-1, default 0.5): raise it if Empathika wakes up by
    # mistake, lower it if she misses you; ./scripts/wake-coach.sh suggests a value.
    # WAKEWORD_TRIGGER_LEVEL=2 needs two hits in a row: fewer false wakes, slightly slower.
    command: --custom-model-dir /custom --threshold ${WAKEWORD_THRESHOLD:-0.5} --trigger-level ${WAKEWORD_TRIGGER_LEVEL:-1}
    volumes: ["./wakewords:/custom"]
    ports: ["10400:10400"]

  whisper:
    logging: *logging
    image: rhasspy/wyoming-whisper:latest
    restart: unless-stopped
    # base-int8 is a good CPU default; use small-int8 for accuracy, tiny-int8 for speed.
    command: --model base-int8 --language en
    volumes: ["./data/whisper:/data"]
    ports: ["10300:10300"]

  piper:
    logging: *logging
    image: rhasspy/wyoming-piper:latest
    restart: unless-stopped
    # British female voice; browse others at https://rhasspy.github.io/piper-samples/
    command: --voice en_GB-jenny_dioco-medium
    volumes: ["./data/piper:/data"]
    ports: ["10200:10200"]

  # Natural-sounding local voice (free). Enable with:  docker compose --profile empathika --profile kokoro up -d
  # then set TTS_PROVIDER=openai in .env (see docs/VOICES.md). First start downloads the model (~350 MB).
  kokoro:
    logging: *logging
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    profiles: ["kokoro"]
    restart: unless-stopped
    ports: ["8880:8880"]

  ollama:
    logging: *logging
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    restart: unless-stopped
    volumes: ["./data/ollama:/root/.ollama"]
    ports: ["11434:11434"]
    # Uncomment for an NVIDIA GPU (needs nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

volumes:
  empathika-data:
    # A fixed name, so Empathika finds her memory whatever the folder is called (e.g. a fresh
    # download unzips as "empathika-assistant-main"). Without it, Docker makes a new, empty store
    # per folder name. Lost memories from an old folder: ./scripts/find-memory.sh
    name: empathika-assistant_empathika-data
