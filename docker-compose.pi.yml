# Empathika box (Raspberry Pi) additions. scripts/pi/setup.sh uses it:
#   docker compose -f docker-compose.yml -f docker-compose.pi.yml up -d --build
# - Sound goes straight to the Pi's PipeWire (the mic board), no sound bridge needed.
# - Empathika shares /run/empathika with the box's WiFi setup service (QR code on the face).
# - The control panel is reachable from your home network at http://empathika.local:8099; it always asks for a
#   password there (chosen on the first visit with a code shown on Empathika's screen, or PANEL_PASSWORD in .env).
services:
  empathika:
    environment:
      PULSE_SERVER: unix:/run/user/${EMPATHIKA_UID:-1000}/pulse/native
      EMPATHIKA_RUN_DIR: /run/empathika
      # Home Assistant on the box (HA_LOCAL=1 in .env, set by setup): Empathika reaches it on the box itself.
      HA_LOCAL_URL: http://host.docker.internal:8123
      # Live meetings: Recall.ai's transcript arrives here through the Cloudflare Tunnel (only that, on its own port).
      MEETINGS_LIVE_HOST: 0.0.0.0
      CONTROL_PANEL_URL: ${CONTROL_PANEL_URL:-http://empathika.local:8099}
    volumes:
      - /run/user/${EMPATHIKA_UID:-1000}/pulse:/run/user/${EMPATHIKA_UID:-1000}/pulse
      - /run/empathika:/run/empathika
      # Home Assistant's settings, read-only, so backups include them (docs/BACKUP.md).
      - /var/lib/max/home-assistant:/app/home-assistant:ro
    ports: !override
      - "8099:8099"
      - "127.0.0.1:8098:8098"
